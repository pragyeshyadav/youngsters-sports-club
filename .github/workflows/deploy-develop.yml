name: Deploy Develop to AWS Lightsail

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: ysc-develop-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy YSC to Lightsail
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ysc_deploy_key
          chmod 600 ~/.ssh/ysc_deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to AWS Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh \
            -i ~/.ssh/ysc_deploy_key \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            "/opt/ysc/deploy.sh"
