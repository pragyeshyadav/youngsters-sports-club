@switch (size) {
  @case ('large') {
    <h1 class="brand-title brand-title--large">{{ resolvedOrganizationName }}</h1>
  }
  @case ('medium') {
    <h2 class="brand-title brand-title--medium">{{ resolvedOrganizationName }}</h2>
  }
  @case ('small') {
    <div
      class="brand-title brand-title--small"
      [attr.aria-label]="resolvedOrganizationName"
    >
      {{ resolvedOrganizationName }}
    </div>
  }
}
