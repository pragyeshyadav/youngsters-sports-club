@switch (size) {
  @case ('large') {
    <h1 class="brand-title brand-title--large">{{ organizationName }}</h1>
  }
  @case ('medium') {
    <h2 class="brand-title brand-title--medium">{{ organizationName }}</h2>
  }
  @case ('small') {
    <div
      class="brand-title brand-title--small"
      aria-label="Youngsters Sports Club and Cafe"
    >
      {{ organizationName }}
    </div>
  }
}
